<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>本轮四个重点 · 飘向宇宙尽头</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#050506;color:#ded8c9;font:12px -apple-system,'PingFang SC',sans-serif}body{display:flex;flex-direction:column}header{padding:15px 22px;display:flex;gap:25px;align-items:center;border-bottom:1px solid #d4c39e20}header>span{font-family:'Songti SC',serif;letter-spacing:.15em}nav{display:flex;gap:8px;flex:1;justify-content:center}button,a{font:inherit;background:none;color:#aaa292;border:0;padding:11px 16px;text-decoration:none;cursor:pointer;white-space:nowrap}button[aria-pressed=true]{color:#f4ecdc;background:#d5c3960f;border-bottom:1px solid #aa9a78}a{font-size:11px}iframe{flex:1;width:100%;border:0;min-height:0}footer{font-size:10px;letter-spacing:.08em;color:#827a6b;padding:9px 15px;text-align:center}@media(max-width:750px){header{padding:8px;gap:0;flex-wrap:wrap}header>span{display:none}nav{gap:0;order:1;width:100%;flex:none}button{font-size:10px;padding:13px 8px;flex:1}a{display:none}footer{font-size:9px}}
</style></head><body><header><span>星河 · 吹气 · 星光祝福</span><nav aria-label="四个重点画面"><button data-scene="" aria-pressed="true">01 · 开场银河</button><button data-scene="eternity">02 · 12万亿年</button><button data-scene="cake">03 · 星光祝福</button><button data-scene="explore">04 · 动态星海</button></nav><a href="./" target="_blank">打开完整电影 ↗</a></header><iframe id="preview" title="生日电影重点预览" src="./" allow="autoplay; fullscreen; microphone"></iframe><footer>星光祝福：等待粒子聚成蛋糕，点击「准备吹蜡烛」并吹气，也可以长按吹灭，观看星烛升空、星尘舒展与完整祝福。音乐需在画面中轻触开启。</footer><script>
for(const button of document.querySelectorAll('nav button'))button.addEventListener('click',()=>{for(const b of document.querySelectorAll('nav button'))b.setAttribute('aria-pressed',b===button);document.getElementById('preview').src=button.dataset.scene?'./?preview='+button.dataset.scene:'./';});
</script></body></html>
